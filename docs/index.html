ements and screenshots.`},sev:`High`,comp:`Header`,title:`Logo collides with the search icon on phones`,summary:`On small phones the centred logo runs into the search icon. The header reserves no room for the three icons on the right.`,sites:{GH:1,416:1,MM:2,QC:1,GC:1,PW:2},viewports:[`390`,`360`,`320`],why:`The navbar centres the logo in the full row. Nothing limits the logo to the space left between the hamburger and the icon cluster, so any wordmark wider than ~90px collides once the row is narrower than about 400px.`,evidence:[`390px: logo right edge vs search left edge — Golden Harvest 232 vs 225, 416 Cannabis 238 vs 225, Queens 236 vs 233, Gormley 238 vs 233. Misty Mountain and Prairie Weed clear it by 9–13px.`,`360px: all six sites overlap (Misty Mountain 205 vs 203, Prairie Weed 199 vs 193, Golden Harvest 217 vs 195).`,`320px: the 416 wordmark (83–203) covers both the search (155–189) and sign-in (201–235) icons; Gormley overlaps by 32px.`],shots:[{src:`screenshots/v1.1/01-header-overlap-416-390.png`,cap:`416 Cannabis at 390px — the wordmark runs 13px into the search button`},{src:`screenshots/v1.1/01-header-overlap-goldenharvest-360.png`,cap:`Golden Harvest at 360px — 22px overlap`},{src:`screenshots/v1.1/01-header-overlap-gormley-320.png`,cap:`Gormley at 320px — 32px overlap`}],fixText:`Lay the mobile navbar out as a three-column grid (burger · logo · icons) and let the logo shrink into its track. Sites whose logo already fits look identical.`,lang:`css`,code:`/* df-navbar.css — phones */
